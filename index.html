<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RareHatch | Systems Developer</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #141417;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-gold: #ffd700;
            --accent-muted: rgba(255, 215, 0, 0.15);
            --border: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            margin-bottom: 50px;
            position: relative;
        }

        .header-line {
            display: inline-block;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 1.05rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 30px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--accent-muted);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-line">RareHatch</div>
            <h1>Systems & UI Portfolio</h1>
            <p class="subtitle">High-fidelity mechanics and custom scripting environments.</p>
        </header>

        <div class="grid">
            <!-- MDT System -->
            <div class="card">
                <div class="card-header">
                    <h3>Mobile Data Terminal (MDT)</h3>
                    <div class="badge">Luau / UI</div>
                </div>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/tAbFpC6XCZk" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Dashcam System -->
            <div class="card">
                <div class="card-header">
                    <h3>Axon Fleet 3 Dashcam</h3>
                    <div class="badge">Telemetry</div>
                </div>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/h6yHBF8ya2Q" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Bodycam System -->
            <div class="card">
                <div class="card-header">
                    <h3>Tactical Bodycam System</h3>
                    <div class="badge">Simulation</div>
                </div>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/acfBzowFnNY" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Chat System -->
            <div class="card">
                <div class="card-header">
                    <h3>Roleplay Chat System</h3>
                    <div class="badge">Core Logic</div>
                </div>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/WOoo68YddaE" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
