<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront Grid</title>
    <style>
        /* Import a nice, bold font for the headers */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@400;500;700&display=swap');

        :root {
            /* 🎨 COLOR PALETTE - Change these to alter the whole theme! */
            --bg-page: #05050a;          /* Deepest background */
            --bg-card: #0d0f18;          /* Card background */
            --accent-main: #00e5ff;      /* Primary bright accent (Cyan) */
            --accent-dark: #005bb5;      /* Darker accent for gradients */
            --badge-bg: rgba(0, 229, 255, 0.15); /* Badge background */
            --badge-text: #00e5ff;       /* Badge text */
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --border-color: #1a1d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            /* Creating a subtle grid background effect like in the image */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container for the grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
        }

        /* Individual Card Styling */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-main);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.15);
        }

        /* Top Banner/Image Area */
        .card-banner {
            height: 160px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Cool diagonal gradient mimicking the image style */
            background: linear-gradient(135deg, var(--accent-dark) 0%, #1a1a2e 50%, var(--accent-dark) 100%);
            border-bottom: 2px solid var(--border-color);
            overflow: hidden;
        }

        /* Adding the dotted overlay pattern to the banner */
        .card-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 4px 4px;
            z-height: 1;
        }

        /* Diagonal line across the banner */
        .card-banner::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            transform: rotate(-25deg);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .banner-text {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.4), 0 0 15px rgba(0, 229, 255, 0.6);
        }

        /* Bottom Content Area */
        .card-content {
            padding: 20px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .price {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .product-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        /* Small box icon inside the badge */
        .product-badge svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

    </style>
</head>
<body>

    <div class="store-grid">
        
        <div class="card">
            <div class="card-banner">
                <div class="banner-text">ROBLOX</div>
            </div>
            <div class="card-content">
                <div class="card-meta">
                    <span class="price">$9.99 &ndash; $49.99</span>
                    <div class="product-badge">
                        <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.22 22.02 11.78 22.02 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.78 1.98 12.22 1.98 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5ZM12 4.15L5.04 8.06L12 11.97L18.96 8.06L12 4.15ZM13 19.82L19 16.45V9.71L13 13.08V19.82ZM11 19.82V13.08L5 9.71V16.45L11 19.82Z"/></svg>
                        1 Products
                    </div>
                </div>
                <h3 class="card-title">Roblox</h3>
            </div>
        </div>

        <div class="card">
            <div class="card-banner" style="background: linear-gradient(135deg, #1a1a2e 0%, var(--accent-dark) 50%, #1a1a2e 100%);">
                <div class="banner-text">SERVICES</div>
            </div>
            <div class="card-content">
                <div class="card-meta">
                    <span class="price">$2.29</span>
                    <div class="product-badge">
                        <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.22 22.02 11.78 22.02 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.78 1.98 12.22 1.98 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5ZM12 4.15L5.04 8.06L12 11.97L18.96 8.06L12 4.15ZM13 19.82L19 16.45V9.71L13 13.08V19.82ZM11 19.82V13.08L5 9.71V16.45L11 19.82Z"/></svg>
                        1 Products
                    </div>
                </div>
                <h3 class="card-title">Services</h3>
            </div>
        </div>

        <div class="card">
            <div class="card-banner">
                <div class="banner-text" style="font-size: 1.8rem; text-align: center; line-height: 1.1;">COUNTER<br>STRIKE 2</div>
            </div>
            <div class="card-content">
                <div class="card-meta">
                    <span class="price">&ndash;</span>
                    <div class="product-badge" style="background-color: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2);">
                        <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.22 22.02 11.78 22.02 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.78 1.98 12.22 1.98 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5ZM12 4.15L5.04 8.06L12 11.97L18.96 8.06L12 4.15ZM13 19.82L19 16.45V9.71L13 13.08V19.82ZM11 19.82V13.08L5 9.71V16.45L11 19.82Z"/></svg>
                        0 Products
                    </div>
                </div>
                <h3 class="card-title">CS:2</h3>
            </div>
        </div>

        <div class="card">
            <div class="card-banner" style="background: linear-gradient(135deg, #1a1a2e 0%, #1a1a2e 50%, var(--accent-dark) 100%);">
                <div class="banner-text">CONFIGS</div>
            </div>
            <div class="card-content">
                <div class="card-meta">
                    <span class="price">$3.99 &ndash; $14.99</span>
                    <div class="product-badge">
                        <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.22 22.02 11.78 22.02 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.78 1.98 12.22 1.98 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5ZM12 4.15L5.04 8.06L12 11.97L18.96 8.06L12 4.15ZM13 19.82L19 16.45V9.71L13 13.08V19.82ZM11 19.82V13.08L5 9.71V16.45L11 19.82Z"/></svg>
                        4 Products
                    </div>
                </div>
                <h3 class="card-title">Configs</h3>
            </div>
        </div>

    </div>

</body>
</html>
