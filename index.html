<!DOCTYPE html>
/<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RareHatch | Portfolio</title>
    <style>
        :root { --bg: #0B0B0E; --text: #E4E4E7; --accent: #FFD700; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 40px; border-left: 3px solid var(--accent); padding-left: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: #18181B; padding: 20px; border-radius: 4px; }
        h3 { margin-top: 0; color: var(--accent); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 15px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RareHatch // Development</h1>
        <div class="grid">
            <div class="card">
                <h3>Dashcam System</h3>

            </div>
            <div class="card">
                <h3>Bodycam System</h3>
                <div class="video-wrapper"><iframe src="YOUR_YOUTUBE_LINK_HERE"></iframe></div>
            </div>
            <div class="card">
                <h3>MDT Interface</h3>
                <div class="video-wrapper"><iframe src="YOUR_YOUTUBE_LINK_HERE"></iframe></div>
            </div>
            <div class="card">
                <h3>RP Chat System</h3>
                <div class="video-wrapper"><iframe src="YOUR_YOUTUBE_LINK_HERE"></iframe></div>
            </div>
        </div>
    </div>
</body>
</html>
